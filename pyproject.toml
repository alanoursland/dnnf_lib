[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "modenexus"
version = "0.2.0"
description = "Decomposable Negation Normal Form (DNNF) compilation, weighted inference, and diagnosis, with optional PyTorch GPU evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alan Oursland" }]
keywords = [
    "dnnf",
    "knowledge-compilation",
    "model-counting",
    "sat",
    "diagnosis",
    "probabilistic-circuits",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/alanoursland/modenexus"
Repository = "https://github.com/alanoursland/modenexus"
Documentation = "https://github.com/alanoursland/modenexus/tree/main/tutorial"

[project.optional-dependencies]
torch = ["torch>=2.0"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["modenexus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
